[package]
name = "sr-apo"
version = "0.1.0"
edition = "2021"
description = "APO (Audio Processing Object) do Surround Rescue: o motor sr-dsp dentro do áudio do Windows"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sr-dsp = { path = "../sr-dsp" }
sr-ipc = { path = "../sr-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Apo",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }
