[package]
name = "sr-host"
version = "0.1.0"
edition = "2021"
description = "Executor de VST3 do Surround Rescue: roda a cadeia de plugins de cada dispositivo para o APO"

[[bin]]
name = "sr-host"
path = "src/main.rs"

[dependencies]
sr-ipc = { path = "../sr-ipc" }
sr-bridge = { path = "../sr-bridge" }
sr-dsp = { path = "../sr-dsp", default-features = false }
clap-sys = "0.5"
vst3-host = { version = "0.11.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
