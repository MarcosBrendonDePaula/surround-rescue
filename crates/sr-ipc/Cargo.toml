[package]
name = "sr-ipc"
version = "0.1.0"
edition = "2021"
description = "Canal de áudio em tempo real entre o APO (audiodg) e o executor de VST (outro processo)"

[dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
] }
windows-core = "0.62"
